[workspace]
members = ["crates/faris-model", "crates/faris-engine", "crates/faris-study", "crates/faris-report", "crates/faris-cli", "crates/faris-app"]
default-members = ["crates/faris-cli"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
authors = ["Avila Labs"]
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
faris-model = { path = "crates/faris-model" }
faris-engine = { path = "crates/faris-engine" }
faris-study = { path = "crates/faris-study" }
faris-report = { path = "crates/faris-report" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
thiserror = "=2.0.21"
clap = { version = "=4.6.6", features = ["derive"] }
nix = { version = "=0.31.3", features = ["process", "signal"] }
tempfile = "=3.27.0"
signal-hook = "=0.3.18"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
zip = { version = "=8.6.0", default-features = false, features = ["zstd"] }
flate2 = "=1.1.10"
rfd = "=0.17.2"
bytemuck = { version = "=1.25.2", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

# PNG encoding is the hot path of the development frame recorder; keep it
# fast in debug builds without optimising the whole dependency tree.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
