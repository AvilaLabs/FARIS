[workspace]
members = ["crates/faris-model", "crates/faris-engine", "crates/faris-study", "crates/faris-report", "crates/faris-cli", "crates/faris-app", "crates/faris-occt", "crates/faris-occt-client"]
default-members = ["crates/faris-cli", "crates/faris-occt-client"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
authors = ["Avila Labs"]
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
faris-model = { path = "crates/faris-model" }
faris-engine = { path = "crates/faris-engine" }
faris-study = { path = "crates/faris-study" }
faris-report = { path = "crates/faris-report" }
faris-occt-client = { path = "crates/faris-occt-client" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
libm = "=0.2.16"
thiserror = "=2.0.21"
clap = { version = "=4.6.6", features = ["derive"] }
nix = { version = "=0.31.3", features = ["process", "signal"] }
tempfile = "=3.27.0"
libproc = "=0.14.11"
win32job = "=2.0.3"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
signal-hook = "=0.3.18"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
zip = { version = "=9.0.4", default-features = false }
flate2 = "=1.1.10"
xz2 = { version = "=0.1.7", features = ["static"] }
rfd = "=0.17.2"
bytemuck = { version = "=1.25.2", features = ["derive"] }
avila-account = { version = "=0.1.2", default-features = false }
ruzstd = { version = "=0.9.1", default-features = false }
lzma-rust2 = { version = "=0.16.2", default-features = false }
regex = { version = "=1.13.1", default-features = false }
console_error_panic_hook = "=0.1.7"
js-sys = "=0.3.105"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
web-sys = "=0.3.105"
web-time = "=1.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

# PNG encoding is the hot path of the development frame recorder; keep it
# fast in debug builds without optimising the whole dependency tree.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3

# The history engine and its arithmetic are the hot loops of the uncertainty
# ensembles; keep them fast in debug builds too.
[profile.dev.package.faris-engine]
opt-level = 3
[profile.dev.package.faris-model]
opt-level = 3
[profile.dev.package.libm]
opt-level = 3
