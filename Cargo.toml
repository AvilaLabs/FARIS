[workspace]
members = ["crates/faris-model", "crates/faris-engine", "crates/faris-cli", "crates/faris-app"]
default-members = ["crates/faris-cli"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
authors = ["Avila Labs"]
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
faris-model = { path = "crates/faris-model" }
faris-engine = { path = "crates/faris-engine" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.21"
clap = { version = "=4.6.6", features = ["derive"] }
nix = { version = "=0.31.3", features = ["process", "signal"] }
tempfile = "=3.27.0"
signal-hook = "=0.3.18"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
