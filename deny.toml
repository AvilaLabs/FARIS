# cargo-deny configuration (QA-039, LEG-003). The CI job in .github/workflows/deny.yml runs
#     cargo deny --locked check licenses bans sources
# on dependency changes and daily. The allowed licences mirror scripts/licence_policy.json, which scripts/check_licences.py
# also enforces in the main workflow; scripts/test_deny_config.py fails if the two lists differ.
# Advisories are not checked here: the audit job runs cargo-audit through scripts/check_audit.py, whose waivers carry an owner,
# a reason and an expiry (SEC-031).

[licenses]
# AGPL-3.0 is compatible with these; GPL-2.0-only is not and is not listed.
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = [
    # Font data bundled by egui, not linked code; the texts are in docs/THIRD_PARTY_NOTICES.md.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
# Several versions of one crate are normal in a graphics stack; the licence and source rules are the gate.
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
