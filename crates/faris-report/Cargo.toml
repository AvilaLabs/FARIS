[package]
name = "faris-report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Study export: PDF summary, CSV data, SVG and PNG charts, and a hashed manifest"

[dependencies]
faris-model.workspace = true
faris-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
krilla = { version = "=0.8.2", default-features = false, features = ["raster-images", "simple-text"] }
krilla-svg = "=0.8.1"
resvg = { version = "=0.47.0", default-features = false, features = ["text"] }
usvg = { version = "=0.47.0", default-features = false, features = ["text"] }
ttf-parser = "=0.25.1"

[dev-dependencies]
faris-engine = { workspace = true, features = ["fixtures"] }

[lints]
workspace = true
