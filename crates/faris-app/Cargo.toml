[package]
name = "faris-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Native egui desktop workspace with a wgpu 3D viewport"

[dependencies]
faris-model.workspace = true
faris-engine.workspace = true
faris-study.workspace = true
faris-report.workspace = true
eframe.workspace = true
bytemuck.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
rfd.workspace = true
avila-account = { version = "0.1", default-features = false, features = ["ui", "client"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[features]
# Development checks only: `--uncertainty-fixture` shows the evaluated
# ensemble views on synthetic covariance. Off in every normal build.
uncertainty-fixture = ["faris-engine/fixtures"]

[dev-dependencies]
faris-engine = { workspace = true, features = ["fixtures"] }

[lints]
workspace = true
