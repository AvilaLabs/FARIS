[package]
name = "faris-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Native egui desktop workspace with a wgpu 3D viewport"

[[bin]]
name = "faris-app"
path = "src/main.rs"

[lib]
name = "faris_app"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
faris-model.workspace = true
faris-engine.workspace = true
faris-study.workspace = true
faris-report.workspace = true
eframe.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
clap.workspace = true
# Opening a study file unpacks it into a scratch folder; the browser build has
# no file system, so that path reports why it cannot run there.
tempfile.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true
avila-account = { workspace = true, features = ["ui", "client"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
avila-account = { workspace = true, features = ["ui"] }
console_error_panic_hook.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Blob", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "Location", "Performance", "Request", "Response", "Storage", "Url", "Window"] }
# std::time::Instant does not exist in the browser; web-time supplies it.
web-time.workspace = true
# The export is handed to the browser as one stored (uncompressed) archive.
zip = { workspace = true }
# The browser picks files through rfd's async dialog.
rfd = { workspace = true, features = ["file-handle-inner"] }

[features]
# Development checks only: `--uncertainty-fixture` shows the evaluated
# ensemble views on synthetic covariance. Off in every normal build.
uncertainty-fixture = ["faris-engine/fixtures"]

[dev-dependencies]
faris-engine = { workspace = true, features = ["fixtures"] }
flate2.workspace = true

[lints]
workspace = true
