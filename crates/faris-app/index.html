<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FARIS</title>
  <link data-trunk rel="icon" type="image/png" href="assets/faris-icon-256.png">
  <!-- The cdylib artifact is the wasm entry point; the bin stays native-only. -->
  <link data-trunk rel="rust" data-target-name="faris_app" data-wasm-opt="z">
  <!-- The recorded study the page opens on load, fetched from this origin. -->
  <link data-trunk rel="copy-dir" href="demo">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: rgb(37, 39, 44); }
    #faris_canvas { width: 100%; height: 100%; display: block; }
    #faris-loading {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; color: #cfd2d8; font-family: sans-serif;
      font-size: 15px; padding: 24px; text-align: center;
    }
  </style>
</head>
<body>
  <!-- eframe renders into this canvas; trunk injects the wasm bundle. -->
  <canvas id="faris_canvas"></canvas>
  <div id="faris-loading">Loading FARIS…</div>
</body>
</html>
