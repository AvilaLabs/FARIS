[package]
name = "faris-study"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "The .faris study file: a verified, content-addressed project container"

[dependencies]
faris-model.workspace = true
faris-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
flate2.workspace = true
tempfile.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zip = { workspace = true, features = ["zstd"] }

# The browser build has no C compiler: zstd entries are read raw and decoded
# by the pure-Rust decoder.
[target.'cfg(target_arch = "wasm32")'.dependencies]
zip = { workspace = true }
ruzstd = { version = "0.9", default-features = false, features = ["std", "hash"] }

[dev-dependencies]
faris-engine = { workspace = true, features = ["fixtures"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["resource", "time"] }

[lints]
workspace = true
