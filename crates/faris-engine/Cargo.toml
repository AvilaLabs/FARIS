[package]
name = "faris-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared FARIS geometry, records, and future simulation operations"

[dependencies]
faris-model.workspace = true
faris-occt-client.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
xz2.workspace = true

# The browser build has no C compiler: the pure-Rust decoder reads xz blobs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
lzma-rust2 = { version = "0.16", default-features = false, features = ["std", "xz"] }

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["resource", "time"] }

[features]
# Small synthetic histories and ensembles for tests and development checks.
# Off in every normal build.
fixtures = []

[dev-dependencies]
tempfile.workspace = true
# Exact big-integer reference for the predicate property tests; test builds only.
num-bigint = "=0.4.8"

[lints]
workspace = true
