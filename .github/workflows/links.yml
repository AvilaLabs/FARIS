name: External links

# Fetches every external http(s) link in the Markdown documents (DOC-026). Weekly, and by hand; the push
# checks run scripts/check_links.py without the network (internal links, anchors and link syntax).

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check that every external link answers
        run: python3 scripts/check_links.py --online
