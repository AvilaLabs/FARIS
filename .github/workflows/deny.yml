name: Dependency policy

# cargo-deny over the dependency graph (QA-039, LEG-003): licences against the AGPL-3.0 allow list in deny.toml,
# banned crates and the registry the crates come from. It runs when the lock file or the policy changes, and daily so a
# changed upstream licence or source is found without a commit. Advisories stay with the audit job in ci.yml.

on:
  push:
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - deny.toml
      - .github/workflows/deny.yml
  pull_request:
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - deny.toml
      - .github/workflows/deny.yml
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.98.1
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-deny
      - run: cargo deny --locked check licenses bans sources
