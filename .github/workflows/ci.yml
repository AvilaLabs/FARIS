name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Native desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev poppler-utils
      - run: cargo fmt --all --check
      # faris-occt builds OpenCASCADE from source (about 90 minutes); it has its own gate, see crates/faris-occt/README.md.
      - run: cargo clippy --workspace --exclude faris-occt --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude faris-occt --locked
      # Documentation of the library crates must build without a rustdoc warning (QA-039). faris-app is left out:
      # its documentation build would compile the whole graphics stack a second time.
      - name: Rust documentation builds without warnings
        run: cargo doc --workspace --exclude faris-occt --exclude faris-app --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # The fuzz entries (fuzz/entries, outside the workspace) run on the seed corpus and plain inputs, so a
      # parser change that panics fails here without a fuzzer. It reuses this job's build directory.
      - name: Fuzz entries survive the seed corpus
        run: |
          python3 scripts/fuzz_seed.py > /dev/null
          CARGO_TARGET_DIR=target cargo test --locked --manifest-path fuzz/entries/Cargo.toml
      - name: Independent analytic control checks (no OpenMC installation)
        run: python3 -m unittest discover -s controls -p 'test_*.py'
      - name: Validation harness tests (no OpenMC installation)
        run: python3 -m unittest discover -s validation -p 'test_*.py'
      - name: CAD transport risk-test checks (no OpenMC installation)
        run: python3 -m unittest discover -s integrations/openmc/risk_tests -p 'test_*.py'
      - name: CAD helper tests (the STEP tests skip without a CAD interpreter)
        run: python3 -m unittest discover -s integrations/cad -p 'test_*.py'
      - name: Seeded-defect corpus files match their recorded hashes
        run: python3 integrations/cad/faris_corpus.py verify --out crates/faris-engine/tests/fixtures/corpus
      - name: Package, release and verification script tests
        run: |
          python3 -m pip install --user pillow==12.1.1
          python3 -m unittest discover -s scripts -p 'test_*.py'
      # Runs the handbook's commands on fixtures with the debug binary built above, parses its JSON examples with
      # the real parsers and checks every other command against the binary's help (QA-016). About 1.5 minutes.
      - name: Documentation samples and tutorials run
        run: python3 scripts/doc_samples.py --faris target/debug/faris --cargo cargo --evidence doc-tests.json
      - name: Documentation sample evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doc-tests-evidence
          path: doc-tests.json
          if-no-files-found: ignore
      # Every command and option is in the reference, generated from the binary's own help (DOC-021).
      - name: Command-line reference is current
        run: python3 scripts/cli_reference.py --faris target/debug/faris --check
      - name: Documentation links resolve, glossary, changelog, deprecations, citation and known-issues page
        run: |
          python3 scripts/check_links.py
          python3 scripts/check_glossary.py
          python3 scripts/check_changelog.py
          python3 scripts/check_deprecations.py
          python3 scripts/check_citation.py
          python3 scripts/known_issues.py --check
      # Every dependency's licence fits AGPL-3.0 under scripts/licence_policy.json (LEG-003), and the SBOM builds and
      # validates (SEC-030). The release workflow attaches the SBOM files to the release.
      - name: Dependency licences and SBOM
        run: |
          cargo fetch --locked
          cargo metadata --locked --offline --format-version 1 > metadata.json
          python3 scripts/check_licences.py --metadata metadata.json
          python3 scripts/generate_sbom.py --metadata metadata.json --out sbom
      - name: Requirement-to-test trace is current
        run: python3 scripts/requirement_trace.py --check
      - name: Requirement scorecard is current
        run: python3 scripts/requirement_scorecard.py --check
      - name: Requirement tables follow the table rules
        run: python3 scripts/requirement_lint.py
      - name: Wording lint over user-facing text
        run: python3 scripts/wording_lint.py
      - name: Materials database and waste tables lint
        run: python3 scripts/materials_db_lint.py
      - name: Validation matrix, rule hashes and case manifests
        run: python3 -m validation.checks
      - name: Source rules for the calculation crates
        run: python3 scripts/source_lint.py
      - name: Platform support table names real CI jobs
        run: python3 scripts/platform_table.py --check
      - name: Defect log lint
        run: python3 scripts/defect_log.py
      - name: Tracked files stay small and hold no nuclear data
        run: python3 scripts/check_repository_size.py

  # Every commit of a pull request from a fork carries a Signed-off-by line whose address is the author's
  # (LEG-005; the policy is in CONTRIBUTING.md). Branches of this repository are not checked.
  sign-off:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Commits are signed off by their authors
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git show -s --format='%ae' "$commit")
            if ! git show -s --format='%B' "$commit" | grep -i '^Signed-off-by: ' | grep -qiF "<${author}>"; then
              echo "::error::Commit $commit has no Signed-off-by line for $author. Amend it with git commit -s --amend (see CONTRIBUTING.md)."
              status=1
            fi
          done
          exit $status

  # RustSec advisories against Cargo.lock (QA-039, SEC-031). A vulnerability, an unmaintained, unsound or yanked
  # crate fails the job unless scripts/audit_allowlist.json waives it with an owner, a reason and an expiry within
  # 90 days; an expired or unused waiver fails too. cargo-deny would add banned crates, duplicate-version rules and
  # a registry allow list in one config; the licence part is scripts/check_licences.py in the check job.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-audit
      - run: python3 scripts/check_audit.py

  # Reopens the recorded demo study from the v0.2.0 release package: rehashes the package index, reopens the
  # saved Core cases against the package's own pinned executables, and checks that a tampered copy is rejected
  # (QA-022). The package is the one web.yml downloads; the script is the copy inside the package, because the
  # repository's script reads the newest package schema. About 20 seconds after the download. Linux only here;
  # the other platforms run the package check in release-smoke.yml. Run time goes to the job summary.
  recorded-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the recorded demo package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p demo-package
          gh release download v0.2.0 -R AvilaLabs/FARIS \
            -p 'FARIS-0.2.0-linux-x86_64.tar.gz' -p 'FARIS-0.2.0-evidence.tar.gz' -p SHA256SUMS -D demo-package
          (cd demo-package && grep -E 'FARIS-0.2.0-(linux-x86_64|evidence).tar.gz' SHA256SUMS | sha256sum -c -)
          tar -xzf demo-package/FARIS-0.2.0-linux-x86_64.tar.gz -C demo-package
          tar -xzf demo-package/FARIS-0.2.0-evidence.tar.gz -C demo-package
      - name: Rehash, reopen and tamper-check the package
        run: |
          set -euo pipefail
          start=$(date +%s)
          demo-package/FARIS-0.2.0/verify.sh > recorded-demo.json
          grep -q '"tamper_control": "EXPECTED_REJECTION"' recorded-demo.json
          echo "Recorded demo verification: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Recorded demo verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recorded-demo-evidence
          path: recorded-demo.json
          if-no-files-found: ignore

  # The tests that need OpenMC itself. A requirement counts as Met only when CI runs its test, so this job
  # fails (instead of skipping) when OpenMC, numpy or the nuclear data is missing: FARIS_REQUIRE_OPENMC=1.
  openmc-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FARIS_REQUIRE_OPENMC: "1"
      OMP_NUM_THREADS: 2
      FARIS_CI_NEUTRON_DATA: ${{ github.workspace }}/ci-data/neutron
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: OpenMC 0.15.3 with DAGMC (conda-forge, environment cached)
        uses: mamba-org/setup-micromamba@b09ef9b599704322748535812ca03efb2625677b # v2.0.5
        with:
          micromamba-version: "2.3.0-0"
          environment-file: integrations/openmc/ci-environment.yml
          environment-name: faris-openmc-ci
          cache-environment: true
          cache-environment-key: openmc-0.15.3-dagmc-nompi-py313
          init-shell: bash
      - name: The installed OpenMC is 0.15.3 and has DAGMC
        run: |
          python - <<'PY'
          import openmc, openmc.lib
          assert openmc.__version__ == "0.15.3", openmc.__version__
          assert openmc.lib._dagmc_enabled(), "this OpenMC was built without DAGMC"
          print("OpenMC", openmc.__version__, "with DAGMC")
          PY
      # Two single-nuclide FENDL-3.2 neutron files (H1 0.1 MB, Fe56 30 MB) out of the OpenMC project's library
      # archive (the one linked from https://openmc.org/data/). The archive is large and has no per-file download,
      # so a cache miss streams it once and keeps only these two files; later runs restore them from the cache.
      # openmc_ci.py checks the bytes against the recorded SHA-256 either way.
      - name: Nuclear data cache (FENDL-3.2 H1 and Fe56)
        id: data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ci-data/neutron
          key: fendl32-neutron-H1-Fe56-v1
      - name: Fetch H1 and Fe56 from the FENDL-3.2 archive
        if: steps.data.outputs.cache-hit != 'true'
        run: |
          mkdir -p ci-data/neutron ci-data/unpacked
          curl -fL --retry 3 https://anl.box.com/shared/static/3cb7jetw7tmxaw6nvn77x6c578jnm2ey.xz \
            | tar -xJ -C ci-data/unpacked --no-anchored --wildcards 'neutron/H1.h5' 'neutron/Fe56.h5'
          cp "$(find ci-data/unpacked -path '*neutron/H1.h5')" "$(find ci-data/unpacked -path '*neutron/Fe56.h5')" ci-data/neutron/
          rm -rf ci-data/unpacked
          ls -l ci-data/neutron
      - name: OpenMC-dependent tests (sampling, lost particles, windows against analogue, numpy helpers)
        run: python -m unittest discover -s integrations/openmc/risk_tests -p 'test_*.py'
      - name: Spike helper tests that need numpy
        run: python -m unittest discover -s integrations/openmc -p 'test_*.py'
