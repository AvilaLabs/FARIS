name: Desktop builds

# Builds the FARIS programs and the pinned Avila Core for each platform (Linux
# on Ubuntu 22.04, so the programs need glibc 2.35 or newer) and uploads them
# as artifacts. Release packages are assembled from these
# artifacts by scripts/retarget_package.py, which also takes the platform's licence
# notices from the build; the recorded study data are not in
# the repository, so packaging happens outside CI.

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Avila Core tag or commit to build
        default: faris-0.1.0-core
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CORE_REF: ${{ github.event.inputs.core_ref || 'faris-0.1.0-core' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
            label: Linux x86_64
            target: x86_64-unknown-linux-gnu
            exe: ""
          - runner: windows-latest
            platform: windows-x86_64
            label: Windows
            target: x86_64-pc-windows-msvc
            exe: .exe
          - runner: macos-15
            platform: macos-aarch64
            label: macOS aarch64
            target: aarch64-apple-darwin
            exe: ""
          - runner: macos-15-intel
            platform: macos-x86_64
            label: macOS x86_64
            target: x86_64-apple-darwin
            exe: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AvilaLabs/Avila-Core
          ref: ${{ env.CORE_REF }}
          path: core
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Build FARIS
        run: cargo build --release --locked -p faris-cli -p faris-app
      - name: Build Avila Core
        working-directory: core
        run: cargo build --release --locked --bin avila-core
      - name: Collect dependency notices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/licenses notices-work
          # Same script and arguments as the Linux docs/THIRD_PARTY_NOTICES.md and
          # docs/CORE_RUNTIME_DEPENDENCY_NOTICES.md, for this platform's Cargo graph.
          # The build downloads only what it compiles; fetch the whole target graph so
          # every crate's licence files are in the cache for the offline collection.
          cargo fetch --locked --target "${{ matrix.target }}"
          cargo metadata --locked --offline --format-version 1 \
            --filter-platform "${{ matrix.target }}" > notices-work/faris.json
          python3 scripts/collect_dependency_notices.py \
            --metadata notices-work/faris.json \
            --root-crate faris-cli --root-crate faris-app \
            --title "FARIS native dependency notices" \
            --platform-label "${{ matrix.label }}" --target-triple "${{ matrix.target }}" \
            --output out/licenses/faris-THIRD_PARTY_NOTICES.md
          cd core
          cargo fetch --locked --target "${{ matrix.target }}"
          cargo metadata --locked --offline --format-version 1 \
            --filter-platform "${{ matrix.target }}" > ../notices-work/core.json
          python3 ../scripts/collect_dependency_notices.py \
            --metadata ../notices-work/core.json \
            --root-crate avila-core-cli \
            --title "Avila Core native dependency notices" \
            --platform-label "${{ matrix.label }}" --target-triple "${{ matrix.target }}" \
            --output ../out/licenses/core-RUNTIME_DEPENDENCY_NOTICES.md
      - name: Collect binaries and build record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/bin
          cp "target/release/faris${{ matrix.exe }}" "target/release/faris-app${{ matrix.exe }}" out/bin/
          cp "core/target/release/avila-core${{ matrix.exe }}" out/bin/
          faris_version=$(out/bin/faris${{ matrix.exe }} --version | tr -d '\r')
          core_version=$(out/bin/avila-core${{ matrix.exe }} --version | tr -d '\r')
          core_commit=$(git -C core rev-parse HEAD)
          glibc=""
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Version number at the end of the first line, e.g. "ldd (Ubuntu GLIBC 2.35-0ubuntu3.8) 2.35".
            glibc=$(ldd --version | sed -n 1p | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?$')
          fi
          python3 - "$faris_version" "$core_version" "$core_commit" "$glibc" <<'EOF'
          import hashlib, json, pathlib, sys
          faris_version, core_version, core_commit, glibc = sys.argv[1:5]
          out = pathlib.Path("out")
          executables = {}
          for path in sorted((out / "bin").iterdir()):
              data = path.read_bytes()
              name = path.name.removesuffix(".exe")
              executables[name] = {
                  "path": "bin/" + path.name,
                  "sha256": "sha256:" + hashlib.sha256(data).hexdigest(),
                  "bytes": len(data),
              }
          notices = {}
          for path in sorted((out / "licenses").iterdir()):
              data = path.read_bytes()
              notices[path.name] = {
                  "path": "licenses/" + path.name,
                  "sha256": "sha256:" + hashlib.sha256(data).hexdigest(),
                  "bytes": len(data),
              }
          record = {
              "schema_version": "faris-desktop-build/v0.1",
              "platform": "${{ matrix.platform }}",
              "runner": "${{ matrix.runner }}",
              "faris_commit": "${{ github.sha }}",
              "faris_version": faris_version,
              "core_commit": core_commit,
              "core_version": core_version,
              "profile": "release",
              "executables": executables,
              "notices": notices,
          }
          if glibc:
              record["glibc"] = glibc
          (out / "build.json").write_text(json.dumps(record, indent=2) + "\n")
          print(json.dumps(record, indent=2))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: faris-${{ matrix.platform }}
          path: out
          if-no-files-found: error
