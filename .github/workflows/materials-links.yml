name: Materials database links

# Asks every source URL and DOI in the materials database and the waste tables whether it still
# resolves (MAT-009). Monthly, and by hand; the push checks run the same lint without the network.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 1 * *"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check that every source resolves
        run: python3 scripts/materials_db_lint.py --check-links
